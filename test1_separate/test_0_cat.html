<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="./debug.js"></script>
    <script src="./effect-wireframe.js"></script>
    <script src="./effect-transparent.js"></script>
    <script src="./effect-desappear.js"></script>
    <script src="./effect-vertices.js"></script>
</head>

<body>

    <a-scene background="color: skyblue"
        debug-keyboard="key: v ; event: vertices; target: #cat">
        <a-assets>
            <a-asset-item id="model-obj" src="./assets/3D_models/obj_lowpolycat/cat.obj"></a-asset-item>
        </a-assets>

        <a-entity id="cat"obj-model="obj: #model-obj;" 
            effect-vertices="radius: 2; color: red"
            position="0 0 -5" scale="0.005 0.005 0.005" rotation="0 -60 0"></a-entity>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="silver"></a-plane>    
    </a-scene>

</body>

</html>
