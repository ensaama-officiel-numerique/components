<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="./debug.js"></script>
    <script src="./effect-wireframe.js"></script>
    <script src="./effect-transparent.js"></script>
    <script src="./effect-desappear.js"></script>
    <script src="./effect-vertices.js"></script>
    <script src="./effect-vertices-desappear.js"></script>
</head>

<body>

    <a-scene background="color: skyblue" 
        debug-keyboard="key: w, i, e, v, b ; 
            event: wireframe, transparent, desappear, vertices, vertices-desappear; 
            target: .chair, .chair, .chair, .chair, .chair">
        <a-assets>
            <a-asset-item id="model-obj" src="./assets/3D_models/obj_chair/Wooden_Chair.obj"></a-asset-item>
            <a-asset-item id="model-mtl" src="./assets/3D_models/obj_chair/Wooden_Chair.mtl"></a-asset-item>
        </a-assets>

        <a-entity class="chair" obj-model="obj: #model-obj; mtl: #model-mtl" 
            effect-wireframe 
            effect-transparent="opacity: 0" 
            effect-desappear="opacity: 0.1; duration: 3000"
            effect-vertices="color: white; radius: 1; opacity: 0"
            effect-vertices-desappear="opacity: 0; duration: 3000"
            position="0 0 -3" scale="0.02 0.02 0.02"></a-entity>

        <a-entity class="chair" obj-model="obj: #model-obj; mtl: #model-mtl" effect-wireframe effect-transparent="opacity: 0"
            effect-desappear="opacity: 0.1; duration: 3000" effect-vertices="color: white; radius: 1; opacity: 0"
            effect-vertices-desappear="opacity: 0; duration: 3000" 
            position="-2 0 -3" scale="0.02 0.02 0.02"></a-entity>

        <a-entity class="chair" obj-model="obj: #model-obj; mtl: #model-mtl" effect-wireframe effect-transparent="opacity: 0"
            effect-desappear="opacity: 0.1; duration: 3000" effect-vertices="color: white; radius: 1; opacity: 0"
            effect-vertices-desappear="opacity: 0; duration: 3000" 
            position="2 0 -3" scale="0.02 0.02 0.02"></a-entity>

        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="silver"></a-plane>    
    </a-scene>

</body>

</html>
